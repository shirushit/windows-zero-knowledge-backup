name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build, Package & Publish Release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies (locked mode)
        run: dotnet restore --locked-mode BackupApp.sln

      - name: Execute test suites
        run: dotnet test BackupApp.sln -c Release --no-restore --verbosity normal

      - name: Build self-contained release package
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backupapp-windows-x64
          path: artifacts/release/*
